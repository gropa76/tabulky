<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fd8">
<meta name="description" content="Úpravy a zpracování tabulek z Excelu – v telefonu i na počítači, i bez internetu.">
<title>Tabulky</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 1.5v-8z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V8M7 13l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7.5h7M8.5 12h1M14.5 12h1M8.5 16.5h1M14.5 16.5h1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7M8 20v-6h8v6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-sigma" viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
  </defs>
</svg>

<div class="app">
  <nav class="rail" aria-label="Hlavní menu">
    <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32"><span>Tabulky</span></div>
    <button class="nav" data-go="home"><svg class="i"><use href="#i-grid"/></svg><span>Přehled</span></button>
    <button class="nav" data-go="editor"><svg class="i"><use href="#i-table"/></svg><span>Tabulka</span></button>
    <button class="nav" data-go="process"><svg class="i"><use href="#i-funnel"/></svg><span>Výstup</span></button>
    <button class="nav install" id="btnInstall" hidden><svg class="i"><use href="#i-install"/></svg><span>Instalovat</span></button>
  </nav>

  <main>
    <!-- PŘEHLED -->
    <section class="view" id="v-home">
      <header class="top">
        <div class="top-title"><h1>Moje tabulky</h1><p class="sub" id="storeInfo"></p></div>
        <div class="top-actions">
          <button class="btn primary" id="btnImport"><svg class="i"><use href="#i-upload"/></svg>Importovat Excel</button>
          <button class="btn" id="btnNew"><svg class="i"><use href="#i-plus"/></svg>Nová</button>
          <button class="btn" id="btnMerge"><svg class="i"><use href="#i-copy"/></svg>Spojit tabulky</button>
          <button class="icon-btn" id="btnHomeMore" aria-label="Další volby"><svg class="i"><use href="#i-more"/></svg></button>
        </div>
      </header>
      <div class="home-body">
        <div class="drop" id="drop"><svg class="i"><use href="#i-file"/></svg><span>Přetáhněte sem soubory .xlsx, .xls, .csv nebo .ods</span></div>
        <div class="cards" id="tableList"></div>
        <h2 class="sec-title">Uložené postupy</h2>
        <p class="sub">Postup = uložené kroky zpracování. Pustíte ho jedním klikem na jakoukoli tabulku.</p>
        <div class="cards" id="recipeList"></div>
      </div>
    </section>

    <!-- EDITOR -->
    <section class="view" id="v-editor">
      <header class="top slim">
        <button class="icon-btn" data-go="home" aria-label="Zpět"><svg class="i"><use href="#i-back"/></svg></button>
        <input class="title-input" id="tblName" aria-label="Název tabulky">
        <span class="meta" id="tblMeta"></span>
        <button class="btn primary" data-go="process"><svg class="i"><use href="#i-funnel"/></svg><span class="hide-s">Zpracovat</span></button>
      </header>
      <div class="toolbar" role="toolbar">
        <button class="tb" id="btnUndo" title="Zpět (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
        <button class="tb" id="btnRedo" title="Znovu (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
        <span class="sep"></span>
        <button class="tb lab" id="btnAddRow"><svg class="i"><use href="#i-plus"/></svg>Řádek</button>
        <button class="tb lab" id="btnAddCol"><svg class="i"><use href="#i-plus"/></svg>Sloupec</button>
        <button class="tb lab" id="btnCalc"><svg class="i"><use href="#i-calc"/></svg>Výpočet</button>
        <span class="sep"></span>
        <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Hledat v tabulce"></label>
        <button class="tb lab" id="btnExport"><svg class="i"><use href="#i-download"/></svg>Stáhnout</button>
      </div>
      <div class="fbar">
        <span class="ref" id="cellRef">–</span>
        <span class="fx">fx</span>
        <input id="fInput" autocomplete="off" spellcheck="false" placeholder="Vyberte buňku. Vzorec začíná =, např. =B2*C2 nebo =SUMA(D2:D20)">
      </div>
      <div class="grid-wrap" id="gridWrap"><table class="grid" id="grid"></table></div>
      <footer class="gridfoot">
        <span id="pageInfo"></span>
        <button class="btn sm" id="btnMoreRows" hidden>Zobrazit další</button>
        <span class="spacer"></span>
        <label class="tot"><svg class="i"><use href="#i-sigma"/></svg>
          <select id="totFn" aria-label="Řádek pod tabulkou">
            <option value="sum">Součet</option><option value="avg">Průměr</option><option value="min">Minimum</option><option value="max">Maximum</option><option value="count">Počet čísel</option><option value="off">Skrýt</option>
          </select>
        </label>
      </footer>
    </section>

    <!-- ZPRACOVÁNÍ -->
    <section class="view" id="v-process">
      <header class="top slim">
        <button class="icon-btn" data-go="editor" aria-label="Zpět"><svg class="i"><use href="#i-back"/></svg></button>
        <div class="top-title"><h1 class="h-sm">Výstup</h1><p class="sub" id="procSrc"></p></div>
      </header>
      <div class="proc">
        <aside class="steps-panel">
          <div class="recipe-bar">
            <select id="recipeSel" aria-label="Uložený postup"></select>
            <button class="btn sm" id="btnSaveRecipe"><svg class="i"><use href="#i-save"/></svg>Uložit postup</button>
          </div>
          <ol class="steps" id="steps"></ol>
          <button class="btn add-step" id="btnAddStep"><svg class="i"><use href="#i-plus"/></svg>Přidat krok</button>
          <button class="btn primary jump" id="btnJump" type="button">Zobrazit výsledek</button>
        </aside>
        <section class="result">
          <div class="result-head">
            <div><b id="resInfo"></b><span class="sub" id="resSub"></span></div>
            <div class="row">
              <button class="btn sm" id="btnResSave"><svg class="i"><use href="#i-table"/></svg>Uložit jako tabulku</button>
              <button class="btn sm primary" id="btnResExport"><svg class="i"><use href="#i-download"/></svg>Stáhnout .xlsx</button>
            </div>
          </div>
          <div class="grid-wrap"><table class="grid ro" id="resGrid"></table></div>
        </section>
      </div>
    </section>
  </main>
</div>

<div class="pop" id="pop" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".xlsx,.xls,.xlsm,.csv,.ods" multiple hidden>
<input type="file" id="backupIn" accept=".json,application/json" hidden>

<script src="lib/xlsx.bundle.js"></script>
<script src="js/formula.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
